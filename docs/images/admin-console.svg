<text x="65" y="100" fill="#475569" font-family="Segoe UI,Arial" font-size="17">Illustrative interface overview</text>

<g filter="url(#s)">
<rect x="100" y="135" width="1200" height="545" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#18263f"/></linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".32"/></filter>
  <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#60a5fa"/></marker>
</defs>
<rect width="1400" height="780" rx="26" fill="url(#bg)"/>
<text x="65" y="68" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="33" font-weight="700">Recovery and maintenance paths</text>
<text x="65" y="104" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="17">Use the least disruptive path that is still available</text>

<g filter="url(#s)">
<rect x="70" y="165" width="270" height="125" rx="18" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
<text x="205" y="205" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI,Arial" font-size="21" font-weight="700">Normal verification</text>
<text x="205" y="240" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI,Arial" font-size="15">Authenticator OTP or</text>
<text x="205" y="266" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI,Arial" font-size="15">one-time user recovery code</text>
</g>

<g filter="url(#s)">
<rect x="430" y="145" width="310" height="165" rx="18" fill="#301934" stroke="#c084fc" stroke-width="2"/>
<text x="585" y="185" text-anchor="middle" fill="#f3e8ff" font-family="Segoe UI,Arial" font-size="21" font-weight="700">Hidden session recovery</text>
<text x="585" y="220" text-anchor="middle" fill="#e9d5ff" font-family="Segoe UI,Arial" font-size="15">After 3 failed OTP attempts</text>
<text x="585" y="246" text-anchor="middle" fill="#e9d5ff" font-family="Segoe UI,Arial" font-size="15">press F8</text>
<text x="585" y="272" text-anchor="middle" fill="#d8b4fe" font-family="Segoe UI,Arial" font-size="15">Unlocks current session only</text>
</g>

<g filter="url(#s)">
<rect x="830" y="145" width="330" height="165" rx="18" fill="#0f2f2d" stroke="#14b8a6" stroke-width="2"/>
<text x="995" y="185" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI,Arial" font-size="21" font-weight="700">Administration Console</text>
<text x="995" y="220" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI,Arial" font-size="15">Planned or operational maintenance</text>
<text x="995" y="246" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI,Arial" font-size="15">Admin OTP + machine key + reason</text>
<text x="995" y="272" text-anchor="middle" fill="#5eead4" font-family="Segoe UI,Arial" font-size="15">Enable or restore enforcement</text>
</g>

<line x1="340" y1="228" x2="430" y2="228" stroke="#60a5fa" stroke-width="4" marker-end="url(#a)"/>
<line x1="740" y1="228" x2="830" y2="228" stroke="#60a5fa" stroke-width="4" marker-end="url(#a)"/>

<text x="70" y="390" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="25" font-weight="700">Emergency machine recovery</text>

<g filter="url(#s)">
<rect x="120" y="440" width="300" height="150" rx="18" fill="#3a2508" stroke="#f59e0b" stroke-width="2"/>
<text x="270" y="482" text-anchor="middle" fill="#fef3c7" font-family="Segoe UI,Arial" font-size="21" font-weight="700">Safe Mode CLI</text>
<text x="270" y="520" text-anchor="middle" fill="#fde68a" font-family="Segoe UI,Arial" font-size="15">wlg-recovery.cmd enable</text>
<text x="270" y="550" text-anchor="middle" fill="#fde68a" font-family="Segoe UI,Arial" font-size="15">Machine key required</text>
</g>

<g filter="url(#s)">
<rect x="550" y="440" width="300" height="150" rx="18" fill="#3a2508" stroke="#f59e0b" stroke-width="2"/>
<text x="700" y="482" text-anchor="middle" fill="#fef3c7" font-family="Segoe UI,Arial" font-size="21" font-weight="700">WinRE CLI</text>
<text x="700" y="520" text-anchor="middle" fill="#fde68a" font-family="Segoe UI,Arial" font-size="15">Works when normal UI fails</text>
<text x="700" y="550" text-anchor="middle" fill="#fde68a" font-family="Segoe UI,Arial" font-size="15">Unlock BitLocker first</text>
</g>

<g filter="url(#s)">
<rect x="980" y="440" width="300" height="150" rx="18" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/>
<text x="1130" y="482" text-anchor="middle" fill="#ffe4e6" font-family="Segoe UI,Arial" font-size="21" font-weight="700">Maintenance active</text>
<text x="1130" y="520" text-anchor="middle" fill="#fecdd3" font-family="Segoe UI,Arial" font-size="15">OTP enforcement bypassed</text>
<text x="1130" y="550" text-anchor="middle" fill="#fecdd3" font-family="Segoe UI,Arial" font-size="15">Restore as soon as possible</text>
</g>

<line x1="420" y1="515" x2="550" y2="515" stroke="#60a5fa" stroke-width="4" marker-end="url(#a)"/>
<line x1="850" y1="515" x2="980" y2="515" stroke="#60a5fa" stroke-width="4" marker-end="url(#a)"/>

<rect x="170" y="665" width="1060" height="65" rx="14" fill="#111827" stroke="#64748b"/>
<text x="700" y="704" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Arial" font-size="16">All maintenance changes are written to admin_audit.jsonl and the service log.</text>
</svg>